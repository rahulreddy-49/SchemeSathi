# ==============================================================================
# SchemeSathi Development Profile (application-dev.properties)
# Used for standalone local development when an external PostgreSQL instance
# is not running. Emulates PostgreSQL using file-backed H2 with Flyway migrations.
# ==============================================================================

# File-backed H2 in PostgreSQL compatibility mode
spring.datasource.url=jdbc:h2:file:./data/schemesathi_dev;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate with H2Dialect in dev
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Flyway Database Migration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Demo account seeding enabled for dev
app.seed.demo-users=true
