server.port=${PORT:8080}
spring.application.name=SchemeSathi

# Active profile: 'dev' for standalone local run; override with SPRING_PROFILES_ACTIVE=prod
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# PostgreSQL Database Configuration (Production / Docker)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/schemesathi}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection Pool (HikariCP)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000

# Flyway Database Migration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true

# JPA / Hibernate (Flyway owns schema evolution; Hibernate validates)
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# JWT Configuration
app.jwt.secret=${JWT_SECRET:SchemeSathiDefaultDevSecret2024ThisMustBeAtLeast256BitsLong!!}
app.jwt.expiration-ms=86400000

# File Upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Demo Seeding Configuration (disabled in production; enabled by default in development)
app.seed.demo-users=${APP_SEED_DEMO_USERS:true}

# AI Configuration (placeholder - use environment variables in production)
app.ai.provider=${AI_PROVIDER:mock}
app.ai.api-key=${AI_API_KEY:}
app.ai.model=${AI_MODEL:gpt-4}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173,http://127.0.0.1:3000}

# Logging
logging.level.com.schemesathi=DEBUG
logging.level.org.springframework.security=WARN
