# ==============================================================================
# SchemeSathi Production Profile (application-prod.properties)
# Active in Docker container runtime and Render cloud deployment.
# Enforces PostgreSQL datasource, Flyway migrations, and disables demo accounts.
# ==============================================================================

# Database Configuration (PostgreSQL on Render)
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection Pool (HikariCP)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000

# Flyway Database Migration (Runs before Hibernate validation)
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true

# JPA / Hibernate: Validate schema matches Flyway migrations
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Demo Seeding: Strictly disabled in production
app.seed.demo-users=false

# Production Logging: Default to INFO; override with LOG_LEVEL if needed
logging.level.com.schemesathi=${LOG_LEVEL:INFO}
logging.level.org.springframework.security=WARN

# Production CORS: Only explicitly configured origins from CORS_ALLOWED_ORIGINS (no localhost default)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}
