# Spring Boot Test Configuration
# Uses H2 in PostgreSQL compatibility mode to test Flyway migrations and JPA schema validation
spring.application.name=SchemeSathi-Test

# Datasource: In-memory H2 with PostgreSQL emulation
spring.datasource.url=jdbc:h2:mem:schemesathitest;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Flyway: Enabled for tests to execute V1__initial_schema.sql against test DB
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# JPA / Hibernate: Validate that entities match Flyway-created schema
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Test Security and JWT Secrets
app.jwt.secret=SchemeSathiTestSecretKey2024MustBeAtLeast256BitsLongForHMACSHA256Compliance!!
app.jwt.expiration-ms=3600000

# Seed demo users disabled by default in tests
app.seed.demo-users=false
